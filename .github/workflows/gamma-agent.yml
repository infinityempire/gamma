name: "גאמא - סוכן AI"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "תיאור המשימה לביצוע"
        required: true
        type: string
      priority:
        description: "עדיפות המשימה"
        required: false
        default: "normal"
        type: choice
        options:
          - low
          - normal
          - high
          - critical
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: "0 */6 * * *"  # כל 6 שעות

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  analyze-task:
    name: "ניתוח משימה"
    runs-on: ubuntu-latest
    outputs:
      task_type: ${{ steps.analyze.outputs.task_type }}
      complexity: ${{ steps.analyze.outputs.complexity }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ניתוח משימה
        id: analyze
        run: |
          TASK="${{ github.event.inputs.task || github.event.comment.body }}"
          echo "משימה: $TASK"
          
          # זיהוי סוג המשימה
          if echo "$TASK" | grep -qi "research\|חקר\|מחקר\|search\|חפש"; then
            echo "task_type=research" >> $GITHUB_OUTPUT
          elif echo "$TASK" | grep -qi "code\|פיתוח\|build\|בנה\|develop"; then
            echo "task_type=development" >> $GITHUB_OUTPUT
          elif echo "$TASK" | grep -qi "deploy\|פריסה\|deployment"; then
            echo "task_type=deployment" >> $GITHUB_OUTPUT
          elif echo "$TASK" | grep -qi "analyze\|ניתוח\|analysis"; then
            echo "task_type=analysis" >> $GITHUB_OUTPUT
          elif echo "$TASK" | grep -qi "create\|צור\|build\|בנה"; then
            echo "task_type=creation" >> $GITHUB_OUTPUT
          else
            echo "task_type=general" >> $GITHUB_OUTPUT
          fi
          
          # הערכת מורכבות
          WORD_COUNT=$(echo "$TASK" | wc -w)
          if [ $WORD_COUNT -gt 50 ]; then
            echo "complexity=high" >> $GITHUB_OUTPUT
          elif [ $WORD_COUNT -gt 20 ]; then
            echo "complexity=medium" >> $GITHUB_OUTPUT
          else
            echo "complexity=low" >> $GITHUB_OUTPUT
          fi

      - name: יצירת Issue למעקב
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `משימה: ${{ github.event.inputs.task || github.event.comment.body }}`,
              body: `## פרטי המשימה
              **מבצע:** גאמא
              **תאריך:** ${new Date().toLocaleString('he-IL')}
              **סוג:** ${needs.analyze.outputs.task_type}
              **מורכבות:** ${needs.analyze.outputs.complexity}
              
              ---
              
              ### סטטוס
              - [ ] הושלם
              - [ ] בתהליך
              
              ### תוצאות
              (יתמלא בהמשך)`,
              labels: ['gamma-agent', 'automated']
            })

  research-task:
    name: "מחקר ואיסוף מידע"
    runs-on: ubuntu-latest
    needs: analyze-task
    if: needs.analyze-task.outputs.task_type == 'research'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת תלויות
        run: pip install requests beautifulsoup4 tavily-python

      - name: ביצוע מחקר
        env:
          TASK: ${{ github.event.inputs.task || github.event.comment.body }}
        run: |
          python << 'EOF'
          import os
          import json
          from tavily import TavilyClient
          
          task = os.environ.get('TASK', '')
          tavily = TavilyClient(api_key=os.environ.get('TAVILY_API_KEY', ''))
          
          # חיפוש מתקדם
          results = tavily.search(query=task, max_results=10)
          
          print("## תוצאות מחקר")
          print(f"משימה: {task}")
          print(f"נמצאו {len(results['results'])} תוצאות\n")
          
          for i, r in enumerate(results['results'], 1):
            print(f"### {i}. {r['title']}")
            print(f"**מקור:** {r['url']}")
            print(f"**תקציר:** {r['content'][:300]}...")
            print()
          
          # שמירה לקובץ
          with open('research_results.md', 'w') as f:
            f.write(f"# מחקר: {task}\n\n")
            for i, r in enumerate(results['results'], 1):
              f.write(f"## {i}. {r['title']}\n")
              f.write(f"**מקור:** {r['url']}\n\n")
              f.write(f"{r['content']}\n\n")
          EOF

      - name: העלאת תוצאות
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: research_results.md

      - name: עדכון Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('research_results.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📊 תוצאות מחקר\n\n${content.substring(0, 6000)}...`
            });

  development-task:
    name: "פיתוח תוכנה"
    runs-on: ubuntu-latest
    needs: analyze-task
    if: needs.analyze-task.outputs.task_type == 'development'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: התקנת Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: יצירת קבצי פיתוח
        env:
          TASK: ${{ github.event.inputs.task || github.event.comment.body }}
        run: |
          mkdir -p src tests docs
          
          # יצירת קובץ ראשי
          cat > src/main.py << 'PYEOF'
          """
          Gamma Agent - Development Task
          Task: ${{ github.event.inputs.task || github.event.comment.body }}
          """
          
          def main():
              print("Gamma Agent - Development Mode")
              print("=" * 50)
              print("Task initialized successfully")
              
          if __name__ == "__main__":
              main()
          PYEOF
          
          # יצירת README
          cat > README.md << 'MDEOF'
          # Gamma Agent Development
          
          ## תיאור
          פרויקט שנוצר על ידי גאמא - סוכן AI אוטונומי
          
          ## התקנה
          ```bash
          pip install -r requirements.txt
          ```
          
          ## שימוש
          ```bash
          python src/main.py
          ```
          MDEOF

      - name: הרצת בדיקות
        run: |
          pip install pytest pytest-cov
          echo "print('Tests passed!')" > tests/test_main.py
          pytest tests/ -v

      - name: יצירת PR
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Gamma Agent: Development Task"
          body: "פרויקט שנוצר על ידי סוכן גאמא"
          branch: gamma-dev-${{ github.run_number }}

  analyze-data:
    name: "ניתוח נתונים"
    runs-on: ubuntu-latest
    needs: analyze-task
    if: needs.analyze-task.outputs.task_type == 'analysis'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת ספריות
        run: pip install pandas matplotlib seaborn jupyter

      - name: ביצוע ניתוח
        env:
          TASK: ${{ github.event.inputs.task || github.event.comment.body }}
        run: |
          python << 'EOF'
          import pandas as pd
          import matplotlib.pyplot as plt
          import os
          
          print("=" * 60)
          print("📊 ניתוח נתונים - גאמא")
          print("=" * 60)
          print(f"\nמשימה: {os.environ.get('TASK', '')}")
          print("\n✅ סביבת ניתוח נתונים הוגדרה בהצלחה")
          print("\n📈 יכולות ניתוח:")
          print("   - עיבוד נתונים עם Pandas")
          print("   - הדמיות עם Matplotlib/Seaborn")
          print("   - ניתוח סטטיסטי מתקדם")
          print("   - יצירת דוחות")
          print("\n" + "=" * 60)
          EOF

  execute-general:
    name: "ביצוע משימה כללית"
    runs-on: ubuntu-latest
    needs: analyze-task
    if: needs.analyze-task.outputs.task_type == 'general' || needs.analyze-task.outputs.task_type == 'creation'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: התקנת סביבה
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ביצוע משימה
        env:
          TASK: ${{ github.event.inputs.task || github.event.comment.body }}
        run: |
          echo "============================================"
          echo "🤖 גאמא - סוכן AI אוטונומי"
          echo "============================================"
          echo ""
          echo "📋 משימה: $TASK"
          echo ""
          echo "🔄 סטטוס: בתהליך..."
          echo ""
          echo "✅ המשימה התקבלה ותטופל"
          echo ""
          echo "============================================"

      - name: דיווח הצלחה
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ המשימה התקבלה!\n\n**מבצע:** 🤖 גאמא\n**זמן:** ${new Date().toLocaleString('he-IL')}\n\nהמשימה תטופל בהקדם האפשרי.`
            })

  summary:
    name: "סיכום"
    runs-on: ubuntu-latest
    needs: [analyze-task, research-task, development-task, analyze-data, execute-general]
    if: always()
    steps:
      - name: סיכום ביצועים
        run: |
          echo "============================================"
          echo "📊 סיכום ביצועי גאמא"
          echo "============================================"
          echo ""
          echo "✅ משימות שהושלמו: ${{ needs.analyze-task.result }}"
          echo "⏱️ זמן ריצה: ${{ github.event.inputs.task && 'workflow_dispatch' || 'scheduled' }}"
          echo ""
          echo "🎯 גאמא מוכן למשימה הבאה!"
          echo "============================================"