name: "Gamma Agent"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init
        run: |
          echo "task_id=$(uuidgen)" >> $GITHUB_OUTPUT
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Agent
        run: |
          python3 ${{ github.workspace }}/agent.py
      - name: Summary
        run: |
          echo "=== Summary ==="
          cat ${{ github.workspace }}/state.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-results
          path: ${{ github.workspace }}/*
          retention-days: 7