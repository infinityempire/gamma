name: "Gamma Agent v2.0"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task / משימה"
        required: true
        type: string
      priority:
        description: "Priority / עדיפות"
        required: false
        default: "normal"
        type: string

env:
  TASK: ${{ github.event.inputs.task }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install openai tavily-python playwright requests
          python -m playwright install chromium --with-deps
          echo "✅ All dependencies installed"

      - name: Initialize State via Python
        shell: python
        env:
          INPUT_TASK: ${{ github.event.inputs.task }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          import json
          import os
          import uuid
          from datetime import datetime

          task = os.environ.get("INPUT_TASK", "מצב מערכת")
          workspace = os.environ.get("WORKSPACE", ".")
          
          state = {
              "task_id": str(uuid.uuid4()),
              "task": task,
              "status": "running",
              "created_at": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          }
          
          with open(os.path.join(workspace, "state.json"), "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          
          print(f"✅ State file created safely with task length: {len(task)}")

      - name: Run Gamma Agent
        run: |
          python3 ${{ github.workspace }}/agent.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          echo "## 🤖 Gamma Agent v2.0 - סיכום" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f state.json ]; then
            STATUS=$(python3 -c "import json; d=json.load(open('${{ github.workspace }}/state.json')); print(d.get('status', 'unknown'))")
            if [ "$STATUS" = "completed" ]; then
              echo "✅ **סטטוס: הושלם בהצלחה!**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **סטטוס: $STATUS**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "=========================================="
          echo "📋 GAMMA AGENT v2.0 - תוצאות"
          echo "=========================================="
          if [ -f response.txt ]; then
            echo ""
            echo "### תוצאות המשימה:"
            cat response.txt
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-results
          path: |
            ${{ github.workspace }}/response.txt
            ${{ github.workspace }}/state.json
            ${{ github.workspace }}/chat.log
            ${{ github.workspace }}/interface_status.json
          retention-days: 7
          overwrite: true
