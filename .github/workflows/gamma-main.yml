name: "Gamma Agent v2.0"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task / משימה"
        required: true
        type: string
      priority:
        description: "Priority / עדיפות"
        required: false
        default: "normal"
        type: string
      max_retries:
        description: "Max retries"
        required: false
        default: "3"
        type: string
      max_iterations:
        description: "Max iterations"
        required: false
        default: "5"
        type: string

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Init State
        run: |
          TASK="${{ github.event.inputs.task }}"
          TASK_ID=$(uuidgen)
          cat > ${{ github.workspace }}/state.json << EOF
          {
            "task_id": "$TASK_ID",
            "task": "$TASK",
            "status": "running",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "State file created"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install openai tavily-python playwright requests
          python -m playwright install chromium --with-deps
          echo "✅ All dependencies installed"

      - name: Run Gamma Agent
        run: |
          python3 ${{ github.workspace }}/agent.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Summary
        run: |
          echo "=== GAMMA AGENT v2.0 COMPLETE ==="
          if [ -f response.txt ]; then
            echo ""
            cat response.txt
          fi
          echo ""
          echo "Status: $(cat state.json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status","N/A"))')"
          echo "Type: $(cat state.json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("task_type","N/A"))')"
          echo "Tools used: $(cat state.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(", ".join(d.get("tools_used",[])) or "none")')"

      - name: Upload Interface Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-status
          path: ${{ github.workspace }}/interface_status.json
          retention-days: 1
          overwrite: true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-results
          path: |
            ${{ github.workspace }}/response.txt
            ${{ github.workspace }}/state.json
            ${{ github.workspace }}/chat.log
            ${{ github.workspace }}/before_login.png
            ${{ github.workspace }}/after_login.png
            ${{ github.workspace }}/browser_screenshot.png
            ${{ github.workspace }}/interface_status.json
          retention-days: 7
