name: "Gamma Agent v2.0"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task / משימה"
        required: true
        type: string
      priority:
        description: "Priority / עדיפות"
        required: false
        default: "normal"
        type: string
      max_retries:
        description: "Max retries"
        required: false
        default: "3"
        type: string
      max_iterations:
        description: "Max iterations"
        required: false
        default: "5"
        type: string

env:
  TASK: ${{ github.event.inputs.task }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Init State
        run: |
          python3 << 'PYEOF'
          import json
          import uuid
          import os
          from datetime import datetime

          task = os.environ.get('TASK', '')
          task_id = str(uuid.uuid4())
          timestamp = datetime.utcnow().isoformat() + 'Z'
          
          state = {
              'task_id': task_id,
              'task': task,
              'status': 'running',
              'created_at': timestamp
          }
          
          output_path = os.path.expanduser('${{ github.workspace }}/state.json')
          with open(output_path, 'w', encoding='utf-8') as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          
          print('✅ State file created')
          print(f'   Task ID: {task_id}')
          print(f'   Task length: {len(task)} chars')
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install openai tavily-python playwright requests
          python -m playwright install chromium --with-deps
          echo "✅ All dependencies installed"

      - name: Run Gamma Agent
        run: |
          python3 ${{ github.workspace }}/agent.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Summary
        run: |
          # Use GitHub Actions output formatting
          echo "## 🤖 Gamma Agent v2.0 - סיכום" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get status from state.json
          STATUS=$(python3 -c "import json; d=json.load(open('${{ github.workspace }}/state.json')); print(d.get('status', 'unknown'))")
          CURRENT_STEP=$(python3 -c "import json; d=json.load(open('${{ github.workspace }}/state.json')); print(d.get('current_directive_step', 0))")
          TOTAL_STEPS=$(python3 -c "import json; d=json.load(open('${{ github.workspace }}/state.json')); print(len(d.get('directive_plan', [])))")
          
          if [ "$STATUS" = "completed" ]; then
            echo "✅ **סטטוס: הושלם בהצלחה!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **סטטוס: $STATUS**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**שלבים שהושלמו:** $CURRENT_STEP / $TOTAL_STEPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show completed steps if available
          COMPLETED_STEPS=$(python3 -c "
import json
d=json.load(open('${{ github.workspace }}/interface_status.json'))
steps = d.get('completed_steps', [])
if steps:
    print('| שלב | סטטוס |')
    print('|-----|-------|')
    for s in steps:
        print(f'| {s} | ✅ |')
else:
    print('אין מידע על שלבים')
")
          echo "$COMPLETED_STEPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Progress bar
          PROGRESS=$(python3 -c "import json; d=json.load(open('${{ github.workspace }}/interface_status.json')); print(d.get('progress_percent', 0))")
          BAR_LEN=20
          FILLED=$((PROGRESS * BAR_LEN / 100))
          EMPTY=$((BAR_LEN - FILLED))
          printf "**התקדמות:** [%s%s] %d%%\n" "$(printf '#%.0s' $(seq 1 $FILLED))" "$(printf '-%.0s' $(seq 1 $EMPTY))" $PROGRESS >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Print to console as well
          echo "=========================================="
          echo "📋 GAMMA AGENT v2.0 - תוצאות"
          echo "=========================================="
          if [ -f response.txt ]; then
            echo ""
            echo "### תוצאות המשימה:"
            cat response.txt
          fi
          echo ""
          echo "=========================================="
          echo "✅ סטטוס: $STATUS"
          echo "📊 שלבים: $CURRENT_STEP / $TOTAL_STEPS"
          echo "📈 התקדמות: $PROGRESS%"
          echo "=========================================="

      - name: Upload Interface Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-status
          path: ${{ github.workspace }}/interface_status.json
          retention-days: 1
          overwrite: true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-results
          path: |
            ${{ github.workspace }}/response.txt
            ${{ github.workspace }}/state.json
            ${{ github.workspace }}/chat.log
            ${{ github.workspace }}/before_login.png
            ${{ github.workspace }}/after_login.png
            ${{ github.workspace }}/browser_screenshot.png
            ${{ github.workspace }}/interface_status.json
          retention-days: 7
