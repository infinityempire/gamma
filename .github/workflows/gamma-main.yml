name: "Gamma Agent"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init
        run: |
          TASK="${{ github.event.inputs.task }}"
          TASK_ID=$(uuidgen)
          cat > ${{ github.workspace }}/state.json << EOF
          {
            "task_id": "$TASK_ID",
            "task": "$TASK",
            "status": "running",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "State file created"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Agent
        run: |
          python3 ${{ github.workspace }}/agent.py
      - name: Summary
        run: |
          echo "=== Summary ==="
          cat ${{ github.workspace }}/state.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-results
          path: ${{ github.workspace }}/*
          retention-days: 7