name: "Gamma Agent"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task"
        required: true
        type: string
      priority:
        description: "Priority"
        required: false
        default: "normal"
        type: string
      max_retries:
        description: "Max retries"
        required: false
        default: "3"
        type: string
      max_iterations:
        description: "Max iterations"
        required: false
        default: "5"
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init
        run: |
          TASK="${{ github.event.inputs.task }}"
          TASK_ID=$(uuidgen)
          cat > ${{ github.workspace }}/state.json << EOF
          {
            "task_id": "$TASK_ID",
            "task": "$TASK",
            "status": "running",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "State file created"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Agent
        run: |
          python3 ${{ github.workspace }}/agent.py
      - name: Summary
        run: |
          echo "=== GAMMA AGENT RESPONSE ==="
          if [ -f ${{ github.workspace }}/response.txt ]; then
            echo ""
            cat ${{ github.workspace }}/response.txt
            echo ""
          fi
          echo "=== STATE ==="
          cat ${{ github.workspace }}/state.json | python3 -c "
import sys, json
try:
    s = json.load(sys.stdin)
    print(f'Status: {s.get(\"status\", \"N/A\")}')
    print(f'Type: {s.get(\"task_type\", \"N/A\")}')
    print(f'Thoughts: {len(s.get(\"thought_process\", []))} items')
except: pass
"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-results
          path: ${{ github.workspace }}/*
          retention-days: 7